services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kairix_judging}
      POSTGRES_USER: ${POSTGRES_USER:-kairix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kairix_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kairix} -d ${POSTGRES_DB:-kairix_judging}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kairix}:${POSTGRES_PASSWORD:-kairix_dev_password}@db:5432/${POSTGRES_DB:-kairix_judging}
      APP_NAME: ${APP_NAME:-Kairix Judgenburn}
      BACKUP_DIR: ${BACKUP_DIR:-/app/backups}
      AUTO_BACKUP_INTERVAL_MINUTES: ${AUTO_BACKUP_INTERVAL_MINUTES:-30}
      AUTO_BACKUP_RETENTION_COUNT: ${AUTO_BACKUP_RETENTION_COUNT:-48}
    ports:
      - "${HOST_PORT:-7080}:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./backups:/app/backups
    restart: unless-stopped

  public:
    build: .
    command: uvicorn app.public_app:app --host 0.0.0.0 --port 8080 --proxy-headers
    environment:
      PUBLIC_UPSTREAM_URL: ${PUBLIC_UPSTREAM_URL:-http://web:8080}
      PUBLIC_PROXY_TIMEOUT_SECONDS: ${PUBLIC_PROXY_TIMEOUT_SECONDS:-4}
    ports:
      - "${PUBLIC_PORT:-7081}:8080"
    depends_on:
      - web
    profiles:
      - public
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: kairix-temp-tunnel
    command: tunnel --no-autoupdate --url http://web:8080
    depends_on:
      - web
    restart: unless-stopped
    profiles:
      - tunnel

volumes:
  postgres_data:
